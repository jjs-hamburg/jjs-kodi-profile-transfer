name: "Build Windows JJS KODI Toolbox EXE"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "installer/jjs_kodi_toolbox.py"
      - "installer/jjs_kodi_database.py"
      - ".github/workflows/build-windows-installer.yml"
      - "README.md"
      - "LICENSE"
  push:
    branches:
      - main
    paths:
      - "installer/jjs_kodi_toolbox.py"
      - "installer/jjs_kodi_database.py"
      - ".github/workflows/build-windows-installer.yml"
      - "README.md"
      - "LICENSE"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 paramiko==5.0.0 pillow==12.3.0 pymysql==1.1.2

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile installer/jjs_kodi_toolbox.py
          python -c "from pathlib import Path; s=Path(\'installer/jjs_kodi_toolbox.py\').read_text(encoding=\'utf-8\'); assert r\'\\n            command =\' not in s, \'literal escaped newline found\'"
          python -c "import installer.jjs_kodi_toolbox as m; assert m.APP_VERSION == '1.14'; assert m.Image is not None; assert m.kodi_db.pymysql is not None; print(m.APP_TITLE, m.APP_VERSION)"
          python -c "from installer import jjs_kodi_database as d; assert d.BACKUP_FORMAT_VERSION == 2; assert d.MAGIC['music'] == 'JJS_MUSIC_DB_BACKUP'; assert d.MAGIC['video'] == 'JJS_VIDEO_DB_BACKUP'; print('Database backup format OK')"
          python -c "from pathlib import Path; s=Path('installer/jjs_kodi_toolbox.py').read_text(encoding='utf-8'); assert 'Transferring restore archive as a file to Android' not in s; assert 'Direct Android profile transfer completed.' in s"
          python -c "import installer.jjs_kodi_toolbox as m; assert m.normalize_windows_unc_path('//MEDIA-NAS/mce/test.tar') == r'\\MEDIA-NAS\mce\test.tar'; assert m.replace_unc_server('//MEDIA-NAS/mce/test.tar', '192.0.2.10') == r'\\192.0.2.10\mce\test.tar'; print('UNC normalization/fallback OK')"
          python -c "from pathlib import Path; s=Path('installer/jjs_kodi_toolbox.py').read_text(encoding='utf-8'); assert 'same platform - full restore' in s; assert 'Preserved target Addons*.db' in s; assert 'binary addon settings' in s; print('Cross-platform addon policy OK')"
          python -c "from pathlib import Path; s=Path('installer/jjs_kodi_toolbox.py').read_text(encoding='utf-8'); assert 'def _install_android_apk' in s; assert 'def _uninstall_android_kodi' in s; assert '/storage/.update/' in s; assert 'The existing app was NOT uninstalled.' in s; print('Install/update safety paths OK')"
          python -c "from pathlib import Path; s=Path('installer/jjs_kodi_toolbox.py').read_text(encoding='utf-8'); assert 'def _build_screenshot_tab' in s; assert 'def _take_android_screenshot' in s; assert 'screencap' in s; assert 'TakeScreenshot({remote},sync)' in s; assert 'Temporary LibreELEC screenshot removed.' in s; print('Screenshot paths OK')"

      - name: Build single EXE
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --collect-all paramiko
          --collect-all pymysql
          --name JJS-KODI-Toolbox
          installer/jjs_kodi_toolbox.py

      - name: Create SHA256SUMS
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/JJS-KODI-Toolbox.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  JJS-KODI-Toolbox.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload test build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: JJS-KODI-Toolbox-test
          path: |
            dist/JJS-KODI-Toolbox.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.14"
          $title = "JJS KODI Toolbox 1.14"
          $notes = "Adds MusicDB and VideoDB backup/restore for MariaDB and local SQLite using the existing JJS Music Library Manager ZIP backup format. Database operations use the same Source A device/Kodi selection. Existing profile, install/update and screenshot functions remain unchanged."

          if (gh release view $tag 2>$null) {
            gh release upload $tag dist/JJS-KODI-Toolbox.exe dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag dist/JJS-KODI-Toolbox.exe dist/SHA256SUMS.txt --title $title --notes $notes
          }
