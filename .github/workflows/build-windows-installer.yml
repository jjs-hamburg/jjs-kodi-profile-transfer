name: "Build Windows JJS KODI Profile Transfer and Install EXE"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "installer/jjs_kodi_profile_transfer.py"
      - ".github/workflows/build-windows-installer.yml"
      - "README.md"
      - "LICENSE"
  push:
    branches:
      - main
    paths:
      - "installer/jjs_kodi_profile_transfer.py"
      - ".github/workflows/build-windows-installer.yml"
      - "README.md"
      - "LICENSE"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 paramiko==5.0.0

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile installer/jjs_kodi_profile_transfer.py
          python -c "from pathlib import Path; s=Path(\'installer/jjs_kodi_profile_transfer.py\').read_text(encoding=\'utf-8\'); assert r\'\\n            command =\' not in s, \'literal escaped newline found\'"
          python -c "import installer.jjs_kodi_profile_transfer as m; assert m.APP_VERSION == '1.11'; print(m.APP_TITLE, m.APP_VERSION)"
          python -c "from pathlib import Path; s=Path('installer/jjs_kodi_profile_transfer.py').read_text(encoding='utf-8'); assert 'Transferring restore archive as a file to Android' not in s; assert 'Direct Android profile transfer completed.' in s"
          python -c "import installer.jjs_kodi_profile_transfer as m; assert m.normalize_windows_unc_path('//MEDIA-NAS/mce/test.tar') == r'\\MEDIA-NAS\mce\test.tar'; assert m.replace_unc_server('//MEDIA-NAS/mce/test.tar', '192.0.2.10') == r'\\192.0.2.10\mce\test.tar'; print('UNC normalization/fallback OK')"
          python -c "from pathlib import Path; s=Path('installer/jjs_kodi_profile_transfer.py').read_text(encoding='utf-8'); assert 'same platform - full restore' in s; assert 'Preserved target Addons*.db' in s; assert 'binary addon settings' in s; print('Cross-platform addon policy OK')"
          python -c "from pathlib import Path; s=Path('installer/jjs_kodi_profile_transfer.py').read_text(encoding='utf-8'); assert 'adb install' not in s or 'install' in s; assert '[str(adb), \"-s\", info[\"serial\"], \"install\", \"-r\", str(path)]' in s; assert '/storage/.update/' in s; assert 'The existing app was NOT uninstalled.' in s; print('Install/update safety paths OK')"

      - name: Build single EXE
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --collect-all paramiko
          --name JJS-KODI-Profile-Backup-Restore-Transfer
          installer/jjs_kodi_profile_transfer.py

      - name: Create SHA256SUMS
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/JJS-KODI-Profile-Backup-Restore-Transfer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  JJS-KODI-Profile-Backup-Restore-Transfer.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.11"
          $title = "JJS KODI Profile Backup/Restore, Transfer & Install 1.11"
          $notes = "Adds local Kodi install/update support for Android and LibreELEC plus explicit Android Kodi uninstall with optional profile backup. Unofficial community tool, provided as-is without warranty or support commitment. Always keep an independent backup of important Kodi profiles."

          if (gh release view $tag 2>$null) {
            gh release upload $tag dist/JJS-KODI-Profile-Backup-Restore-Transfer.exe dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag dist/JJS-KODI-Profile-Backup-Restore-Transfer.exe dist/SHA256SUMS.txt --title $title --notes $notes
          }
